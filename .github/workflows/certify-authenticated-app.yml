name: NestAI authenticated consumer canary contract
on:
  pull_request:
    paths:
      - scripts/certify-authenticated-app.mjs
      - tests/certify-authenticated-app.nodecheck.mjs
      - docs/AUTHENTICATED_CANARY_RUNBOOK.md
      - .github/workflows/certify-authenticated-app.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test synthetic canary without cloud credentials
        run: node --test tests/certify-authenticated-app.nodecheck.mjs
