name: Deploy production
on:
  push:
    branches: ["production"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm build
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: "6LcpY-EtAAAAAElqBbIL_K7nAkm2wpuF6fbhsggG"
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply nestai --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm deploy:dry
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live Worker smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://nestai.pastordanielpcunha.workers.dev"

          curl --fail --silent --show-error \
            --retry 8 --retry-delay 2 --retry-all-errors \
            "$BASE_URL/health" -o /tmp/health.json

          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (health.ok !== true || health.service !== 'nestai' || health.billingMode !== 'FREE_ONLY') {
            throw new Error('NESTAI_LIVE_HEALTH_INVALID');
          }
          console.log('NESTAI_LIVE_HEALTH_OK');
          NODE

          STATUS="$(curl --silent --show-error \
            -o /tmp/run-unauth.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"task":"nestlume.study.answer","input":"smoke","context":{"organizationId":"smoke"}}' \
            "$BASE_URL/v1/run")"
          test "$STATUS" = "401"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/run-unauth.json','utf8'));if(x.error!=='AUTH_MISSING_BEARER')process.exit(1);console.log('NESTAI_LIVE_AUTH_GATE_OK');"
      - name: Official domain smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai.millionsnest.com"

          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/health" -o /tmp/domain-health.json

          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/domain-health.json','utf8'));
          if (health.ok !== true || health.service !== 'nestai' || health.billingMode !== 'FREE_ONLY') {
            throw new Error('NESTAI_DOMAIN_HEALTH_INVALID');
          }
          console.log('NESTAI_OFFICIAL_DOMAIN_HEALTH_OK');
          NODE

      - name: Live Cloudflare storage and primitives certification
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo "nestai live storage certification ${GITHUB_SHA}" > /tmp/nestai-r2-smoke.txt
          KEY="smoke/release-${GITHUB_SHA}.txt"

          pnpm wrangler r2 object put "nestai-knowledge/${KEY}" \
            --file /tmp/nestai-r2-smoke.txt \
            --content-type text/plain \
            --remote \
            --force

          pnpm wrangler r2 object get "nestai-knowledge/${KEY}" \
            --file /tmp/nestai-r2-roundtrip.txt \
            --remote

          cmp /tmp/nestai-r2-smoke.txt /tmp/nestai-r2-roundtrip.txt

          pnpm wrangler r2 object delete "nestai-knowledge/${KEY}" \
            --remote \
            --force

          if pnpm wrangler r2 object get "nestai-knowledge/${KEY}" \
            --file /tmp/nestai-r2-should-not-exist.txt \
            --remote >/tmp/r2-delete-check.log 2>&1; then
            echo "R2_DELETE_VERIFICATION_FAILED" >&2
            cat /tmp/r2-delete-check.log >&2 || true
            exit 1
          fi

          pnpm wrangler d1 execute nestai --remote \
            --command "SELECT COUNT(*) AS rows FROM r2_usage_monthly;" \
            >/tmp/nestai-d1-r2-ledger.txt
          grep -q '"rows"' /tmp/nestai-d1-r2-ledger.txt

          pnpm wrangler vectorize list >/tmp/nestai-vectorize.txt
          grep -q "nestai-knowledge" /tmp/nestai-vectorize.txt

          pnpm wrangler queues list >/tmp/nestai-queues.txt
          grep -q "nestai-jobs" /tmp/nestai-queues.txt
          grep -q "nestai-jobs-dlq" /tmp/nestai-queues.txt

          echo "NESTAI_LIVE_CLOUDFLARE_PRIMITIVES_OK"

      - name: External provider readiness smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai.millionsnest.com"

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/v1/health/providers" -o /tmp/provider-health.json

          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/provider-health.json','utf8'));
          if (body.ok !== true || body.service !== 'nestai' || body.billingMode !== 'FREE_ONLY') {
            throw new Error('NESTAI_PROVIDER_HEALTH_INVALID');
          }
          for (const provider of ['groq','gemini','mistral']) {
            const probe = body.probes?.[provider];
            if (!probe?.state) throw new Error('NESTAI_PROVIDER_PROBE_MISSING_' + provider.toUpperCase());
            console.log(`NESTAI_PROVIDER_${provider.toUpperCase()}=${probe.state}`);
          }
          NODE

      - name: Mission Control smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ai.millionsnest.com"

          curl --fail --silent --show-error             --retry 20 --retry-delay 3 --retry-all-errors             "$BASE_URL/" -o /tmp/console.html
          grep -q "NestAI — MillionsNest Intelligence Platform" /tmp/console.html

          curl --fail --silent --show-error             --retry 10 --retry-delay 2 --retry-all-errors             "$BASE_URL/providers" -o /tmp/providers.html
          grep -q "NestAI — MillionsNest Intelligence Platform" /tmp/providers.html

          STATUS="$(curl --silent --show-error             -o /tmp/admin.json             -w '%{http_code}'             "$BASE_URL/v1/admin/overview")"
          test "$STATUS" = "401"
          echo "NESTAI_MISSION_CONTROL_LIVE_OK"
