name: Auto Provision Cloudflare D1
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/auto-provision-cloudflare.yml"
permissions:
  contents: write
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pnpm install --frozen-lockfile=false
      - name: Provision D1 and apply migrations
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit resolved D1 binding
        run: |
          if git diff --quiet -- wrangler.jsonc; then
            echo "No wrangler config change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "infra: bind provisioned NestAI D1 database"
          git push
